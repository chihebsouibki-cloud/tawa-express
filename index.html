x("strong",{children:"Obligation Spécifique COD (Contre-Remboursement) :"})," Vos statuts et contrats marchands doivent inclure une clause de ",a.jsx("em",{children:"Mandat d’Encaissement pour le compte de tiers"}),". Séparez strictement le compte bancaire de cantonnement des fonds marchands (Classe 4) de votre chiffre d’affaires propre (frais de livraison de 7–8 DT)."]})]})]}),a.jsxs("div",{className:"mt-4 pt-3 border-t border-slate-200 flex items-center justify-between text-xs text-[#A99BC7]",children:[a.jsx("span",{className:"font-mono-code",children:"Forme juridique recommandée :"}),a.jsx("span",{className:"font-mono-code font-bold text-[#F2EDFF] bg-slate-100 px-2.5 py-1 rounded",children:"SARL de Droit Tunisien (Code APII Services Logistiques + IT)"})]})]})]})]})},Ao=[{id:"art-2-2008",decreeYear:"2008",decreeTitleFr:"Arrêté de base du 10 décembre 2008 — Cahier des charges (Personnes Morales)",decreeTitleAr:"كراس شروط يتعلق بتعاطي الأشخاص المعنويين لنشاط نقل البضائع على الطرقات لحساب الغير (10 ديسمبر 2008)",jortRef:"Arrêté du Ministre du Transport du 10/12/2008 (Bâb I - Dispositions Générales)",signatories:"Ministère du Transport — Direction Générale des Transports Terrestres (DGTT)",articleNumberFr:"Articles 1 & 2 — Le Seuil Légal des 12 Tonnes (PTAC)",articleNumberAr:"الفصل الأول والفصل 2 — شرط الـ 12 طنا",arabicText:`الفصل الأول: يعتبر نقلا لحساب الغير كل نقل للبضائع ينجز بمقابل أو يكون معروضا على العموم.
الفصل 2: يتعين على الممثل القانوني للشخص المعنوي الذي يرغب في ممارسة نشاط نقل البضائع على الطرقات لحساب الغير بواسطة عربات يفوق وزنها الجملي المرخص فيه إثني عشر (12) طنا، الالتزام كتابيا بمضمون هذا الكراس وذلك بتحرير التصريح الملحق به في نظيرين أصليين معرّفين بالإمضاء ينص على تاريخ ممارسة النشاط، يودع أحدهما لدى المصالح المختصة لوزارة النقل ويحتفظ بالنظير الثاني بعد ختمه من قبل هذه المصالح.`,frenchTranslation:`Article 1er : Est considéré comme transport pour le compte d’autrui tout transport de marchandises effectué à titre onéreux ou offert au public.
Article 2 : Le représentant légal de la personne morale désirant exercer l’activité de transport routier de marchandises pour le compte d’autrui au moyen de véhicules dont le Poids Total Autorisé en Charge (PTAC) DÉPASSE DOUZE (12) TONNES doit s’engager par écrit au contenu du présent cahier des charges en établissant la déclaration annexée en deux exemplaires originaux avec signature légalisée...`,impactLevel:"critique",impactSummaryForParcelStartup:"POINT CLÉ POUR VOTRE ÉQUIPE : Ce cahier des charges (et l’obligation de détenir 6 camions lourds) ne s’applique JURIDIQUEMENT qu’aux véhicules dont le PTAC dépasse 12 tonnes ! Conformément à la Loi n° 2004-33 et à cet arrêté du 10/12/2008, le transport routier de marchandises pour le compte d’autrui au moyen de véhicules utilitaires dont le PTAC est ≤ 12 tonnes (fourgonnettes type Partner/Kangoo/Berlingo/Ducato < 3,5t utilisées par First Delivery ou Aramex) est LIBRE de ce cahier des charges poids lourds."},{id:"art-5-6-2008",decreeYear:"2008",decreeTitleFr:"Conditions relatives à la Société et au Gérant (Cahier des charges 2008 & 2022)",decreeTitleAr:"الباب الثاني : شروط تعاطي النشاط — الشخص المعنوي والممثل القانوني",jortRef:"Articles 5 et 6 (modifiés par l’Arrêté du 16 mai 2022)",signatories:"Ministère du Transport — DGTT",articleNumberFr:"Articles 5 & 6 — Nationalité, Objet Social & Compétence Professionnelle",articleNumberAr:"الفصل 5 والفصل 6 — الجنسية والكفاءة المهنية",arabicText:`الفصل 5: يجب أن تتوفر في الشخص المعنوي الذي يرغب في تعاطي نشاط نقل البضائع لحساب الغير الشروط التالية:
- أن ينص موضوعه الاجتماعي على تعاطي نشاط نقل البضائع على الطرقات لحساب الغير.
- أن يتمتع بالجنسية التونسية طبقا لأحكام المرسوم عدد 14 لسنة 1961 المؤرخ في 30 أوت 1961...
الفصل 6: يجب أن تتوفر في الممثل القانوني للشخص المعنوي الشروط التالية:
- أن لا يكون قد حكم عليه بسبب ارتكابه لجناية أو لجنحة بأكثر من ثلاثة أشهر سجنا بدون تأجيل التنفيذ أو بأكثر من ستة أشهر مع الإسعاف بتأجيل التنفيذ وأن لا يكون قد صدر ضده حكم بالإفلاس...
- أن يتوفر لديه أحد شروط الكفاءة المهنية التالية: خبرة بالبلاد التونسية لمدة 3 سنوات على الأقل على مستوى التسيير في مجال النقل البري للبضائع، أو شهادة جامعية في اختصاص له علاقة بالنشاط، أو شهادة الكفاءة المهنية لنقل البضائع (الأمر عدد 2118 لسنة 2006). وفي صورة عدم توفر أي شرط لدى الممثل القانوني، يجب تشغيل شخص توكل له مسؤولية في التسيير وتتوفر لديه هذه الكفاءة.`,frenchTranslation:`Article 5 : La personne morale doit : 1) Mentionner expressément dans son objet social l’exercice du transport routier de marchandises pour le compte d’autrui ; 2) Avoir la nationalité tunisienne au sens du Décret-loi n° 61-14 du 30 août 1961 (majorité du capital tunisienne).
Article 6 : Le représentant légal doit avoir un casier judiciaire conforme (Bulletin n°3) et justifier d’une compétence professionnelle : soit 3 ans d’expérience de gestion dans le transport terrestre, soit un diplôme universitaire lié au secteur, soit le certificat de compétence professionnelle (Décret n° 2006-2118). À défaut, la société peut salarier un directeur technique titulaire de cette compétence.`,impactLevel:"majeur",impactSummaryForParcelStartup:"Même si vous démarrez avec des utilitaires légers (< 3,5t / ≤ 12t), il est fortement recommandé de rédiger dès le départ votre Objet Social en conformité avec l’Article 5 et de respecter la condition de nationalité tunisienne (Décret-loi 61-14 pour les activités commerciales et logistiques en Tunisie). Si vous passez un jour à des camions > 12t pour vos liaisons inter-gouvernorats (ex: Tunis-Sfax), le gérant ou un cadre salarié devra justifier du diplôme ou des 3 ans d’expérience."},{id:"art-10-2017",decreeYear:"2017",decreeTitleFr:'Arrêté du 28 février 2017 — Suppression du régime dérogatoire "Jeunes Promoteurs"',decreeTitleAr:"قرار من وزير النقل مؤرخ في 28 فيفري 2017 يتعلق بالمصادقة على تنقيح بعض أحكام كراس الشروط",jortRef:"JORT — Arrêté du 28 février 2017",signatories:"Anis Ghedira (Ministre du Transport) / Youssef Chahed (Chef du Gouvernement)",articleNumberFr:"Articles 1 & 2 — Abrogation des Articles 10 (nouveau), 10 bis et 10 ter",articleNumberAr:"الفصل الأول والفصل 2 — إلغاء الفصول 10 (جديد) و10 مكرر و10 ثالثا",arabicText:`الفصل الأول: تلغى أحكام الفصول 10 (جديد) و10 مكرر و10 ثالثا من كراس الشروط المتعلق بتعاطي الأشخاص المعنويين لنشاط نقل البضائع على الطرقات لحساب الغير المصادق عليه بقرار وزير النقل المؤرخ في 10 ديسمبر 2008 كما تم تنقيحه وإتمامه بقرار وزير النقل المؤرخ في 15 جويلية 2013.
الفصل 2: يبقى الباعثون الشبان الذين يتعاطون هذا النشاط قبل صدور هذا القرار خاضعين إلى أحكام قرار وزير النقل المؤرخ في 10 ديسمبر 2008 المشار إليه أعلاه.`,frenchTranslation:`Article 1er : Sont abrogées les dispositions des articles 10 (nouveau), 10 bis et 10 ter du cahier des charges (qui avaient été introduites par l’arrêté du 15 juillet 2013 pour permettre aux jeunes promoteurs en SUARL de démarrer avec 3 camions > 12t au lieu de 18).
Article 2 : Les jeunes promoteurs exerçant déjà cette activité avant la parution du présent arrêté demeurent régis par les dispositions antérieures.`,impactLevel:"informatif",impactSummaryForParcelStartup:'Historiquement, entre 2008 et 2022, le cahier des charges > 12t exigeait 18 camions et 300 tonnes de charge utile ! La dérogation "Jeune Promoteur" (3 camions en SUARL) créée en 2013 a été supprimée en février 2017, avant que la réforme de mai 2022 n’abaisse le seuil général à 6 camions pour toutes les sociétés.'},{id:"art-8-9-2022",decreeYear:"2022",decreeTitleFr:"Arrêté du 16 mai 2022 — Réduction du quota de flotte (> 12t) de 18 à 6 véhicules",decreeTitleAr:"قرار من وزير النقل مؤرخ في 16 ماي 2022 يتعلق بالمصادقة على أحكام تنقح كراس الشروط",jortRef:"JORT n° 62 du 31 mai 2022 (Pages 1834-1835)",signatories:"Rabii Majidi (Ministre du Transport) / Najla Bouden Romdhane (Cheffe du Gouvernement)",articleNumberFr:"Articles 8 (nouveau), 9 (nouveau) & 11 (nouveau) — Flotte > 12 tonnes",articleNumberAr:"الفصل 8 (جديد) والفصل 9 (جديد) والفصل 11 (جديد)",arabicText:`الفصل 8 (جديد): يجب أن يكون الشخص المعنوي مالكا أو مستأجرا بطريقة الايجار المالي لأسطول يتركب على الأقل من 6 عربات نقل بضائع مسجلة بالبلاد التونسية يتجاوز الوزن الجملي المرخص فيه لكل منها اثني عشر (12) طنا.
الفصل 9 (جديد): يجب أن يتكون هذا الأسطول من عربات لا يتجاوز عمرها الخمس سنوات عند تاريخ إيداع مطلب الحصول على بطاقة الاستغلال لأول مرة، أو عند القيام بعملية تعويض العربة.
الفصل 11 (جديد): يجب أن يكون الأسطول المستغل مستجيبا بصفة دائمة للشرط المتعلق بعدد العربات.`,frenchTranslation:`Article 8 (nouveau) : La personne morale doit être propriétaire ou locataire par voie de leasing (إيجار مالي) d’une flotte composée d’au moins SIX (6) véhicules de transport de marchandises immatriculés en Tunisie dont le PTAC de chacun dépasse douze (12) tonnes.
Article 9 (nouveau) : Cette flotte doit être composée de véhicules dont l’âge ne dépasse pas CINQ (5) ans à la date du dépôt de la demande de carte d’exploitation pour la première fois ou lors du remplacement d’un véhicule (suppression de l’ancienne condition de 2 ans d’âge et de 300 tonnes de charge utile).`,impactLevel:"majeur",impactSummaryForParcelStartup:"Cette réforme de mai 2022 confirme noir sur blanc dans l’Article 8 (nouveau) que le quota de 6 véhicules et la carte d’exploitation (بطاقة الاستغلال) ne visent QUE les camions lourds dont le PTAC > 12 tonnes. Vos fourgonnettes de livraison e-commerce (PTAC 1,8t à 3,5t) ne sont PAS soumises au quota des 6 véhicules ni à la limite d’âge de 5 ans."},{id:"art-13-2025",decreeYear:"2025",decreeTitleFr:"Arrêté du 30 septembre 2025 — Abrogation de l’Article 13 (Fin des exemptions spécialisées > 12t)",decreeTitleAr:"قرار من وزير النقل مؤرخ في 30 سبتمبر 2025 يتعلق بالمصادقة على تنقيح كراس الشروط",jortRef:"JORT — Arrêté du 30 septembre 2025",signatories:"Rachid Amri (Ministre du Transport) / Sarra Zaafrani Zenzri (Cheffe du Gouvernement)",articleNumberFr:"Articles 1, 2 & 3 — Abrogation de l’Article 13 du Cahier des charges",articleNumberAr:"الفصل الأول والفصل 2 والفصل 3 — إلغاء الفصل 13",arabicText:`الفصل الأول: يتم بمقتضى هذا القرار المصادقة على إلغاء الفصل 13 من كراس الشروط المتعلق بتعاطي الأشخاص المعنويين لنشاط نقل البضائع على الطرقات لحساب الغير، المصادق عليه بمقتضى قرار وزير النقل المؤرخ في 10 ديسمبر 2008 المشار إليه أعلاه.
الفصل 2: تنطبق الشروط الواردة بالفصل 8 من كراس الشروط... على الأشخاص المعنويين المالكين أو المستأجرين قبل تاريخ نشر هذا القرار للعربات المخصصة لحمل العربات أو جر أو دفع العربات المعطبة وغيرها والنقل الاستثنائي وعمليات الانتقال ونقل النفايات غير الخطرة ونقل الحيوانات ونقل الأموال، وذلك بعد انقضاء سنة من تاريخ دخول هذا القرار حيز النفاذ.
الفصل 3: لا تنطبق الشروط الواردة بالفصل 9 من كراس الشروط... على الأشخاص المعنويين المالكين أو المستأجرين قبل تاريخ نشر هذا القرار للعربات المخصصة لحمل العربات أو جر أو دفع العربات المعطبة وغيرها والنقل الاستثنائي وعمليات الانتقال ونقل النفايات غير الخطرة ونقل الحيوانات ونقل الأموال.`,frenchTranslation:`Article 1er : Est approuvée par le présent arrêté l’abrogation de l’Article 13 du cahier des charges du 10 décembre 2008.
Article 2 : Les conditions prévues à l’Article 8 (obligation d’avoir au moins 6 véhicules > 12 tonnes) s’appliquent désormais aux personnes morales propriétaires ou locataires avant la publication de cet arrêté de véhicules affectés au transport de voitures, dépannage/remorquage, transport exceptionnel, déménagement (عمليات الانتقال), transport de déchets non dangereux, d’animaux et transport de fonds (نقل الأموال), après l’expiration d’un délai d’un (1) an à compter de l’entrée en vigueur du présent arrêté.
Article 3 : La condition d’âge de 5 ans (Article 9) ne s’applique pas rétroactivement aux sociétés possédant ou louant ces véhicules spécialisés avant la publication du présent arrêté.`,impactLevel:"critique",impactSummaryForParcelStartup:"DÉCRYPTAGE EXCLUSIF DE VOTRE DOCUMENT DE SEPTEMBRE 2025 : Beaucoup d’investisseurs s’inquiètent de cet arrêté du 30 septembre 2025 sans en connaître le contenu exact. Comme le montre le texte arabe que vous avez fourni, cet arrêté abroge uniquement l’Article 13 (qui dispensait du quota de 6 camions > 12t les activités de déménagement, remorquage, transport de fonds, bétail et déchets). Il NE modifie PAS le seuil de 12 tonnes de l’Article 2 ! Votre activité de livraison de petits colis par véhicules légers (< 3,5t / ≤ 12t) reste donc parfaitement hors du champ de contrainte des 6 poids lourds."}],Yg=[{criterion:"Type de véhicules / Activité",lightTransportUnder12T:"Véhicules utilitaires légers (PTAC ≤ 12 tonnes : fourgonnettes 1,5t à 3,5t, camions légers)",heavyTransportOver12T:"Camions poids lourds & semi-remorques (PTAC > 12 tonnes)",freightExchangeCentrale:"Plateforme d’intermédiation pure (Centrale de Fret / مركزية نقل البضائع)",postalExpressCourier:"Courrier postal & correspondance (< 2 kg) / Opérateur Postal Express"},{criterion:"Texte de référence en Tunisie",lightTransportUnder12T:"Loi n° 2004-33 + Arrêté du 10/12/2008 (Art. 2 a contrario) + Déclaration APII Services",heavyTransportOver12T:"Cahier des charges du 10/12/2008 modifié le 16/05/2022 et le 30/09/2025",freightExchangeCentrale:"Loi n° 2004-33 (Art. 29-30) + Arrêté du 05/10/2009 modifié le 16/05/2022",postalExpressCourier:"Code de la Poste (Loi n° 98-38 du 2 juin 1998)"},{criterion:"Autorisation ou Cahier des charges DGTT",lightTransportUnder12T:"LIBRE de cahier des charges DGTT Poids Lourds (Constitution SARL + APII + RNE + Patente)",heavyTransportOver12T:"Soumis au Cahier des charges DGTT + Déclaration préalable légalisée + Cartes d’exploitation ATTT",freightExcha lui qui permet aux leaders tunisiens de scaler rapidement sans alourdir leurs charges fixes."}],Co=`ARTICLE 2 — OBJET SOCIAL (Proposition à faire valider par votre Avocat / Expert-Comptable)

La société a pour objet, en Tunisie et à l'étranger, directement ou indirectement, sous réserve du respect de la législation en vigueur et des cahiers des charges sectoriels éventuellement applicables :

1. La fourniture de tous services logistiques intégrés destinés aux commerçants, aux entreprises et aux opérateurs du commerce électronique (e-commerce), comprenant notamment la réception, le contrôle, le stockage, la préparation de commandes (fulfillment), l'emballage, l'étiquetage et la gestion des retours.

2. Le transport routier léger de marchandises, de petits colis et de produits commerciaux pour le compte d'autrui au moyen de véhicules utilitaires dont le poids total autorisé en charge (PTAC) n'excède pas le seuil réglementaire fixé par la législation des transports terrestres en vigueur, ainsi que la livraison à domicile ou en points relais.

3. La conception, le développement, l'édition, l'exploitation et la commercialisation de plateformes numériques, d'applications mobiles et de solutions logicielles de gestion des commandes, d'optimisation des tournées, de traçabilité et de suivi des livraisons en temps réel.

4. La mise en relation commerciale et technique entre les commerçants expéditeurs, les acheteurs destinataires et les prestataires de transport routier dûment habilités, ainsi que la sous-traitance d'opérations de transport et de distribution auprès de transporteurs patentés.

5. L'encaissement pour le compte de tiers (contre-remboursement / paiement à la livraison) du prix des marchandises livrées en exécution d'un mandat d'encaissement exprès confié par les commerçants expéditeurs, et la gestion administrative du reversement desdits fonds.

6. Et plus généralement, toutes opérations commerciales, industrielles, financières, mobilières ou immobilières se rattachant directement ou indirectement à l'objet social ou susceptibles d'en favoriser l'extension ou le développement.`,So=`Objet : Demande de confirmation relative au régime juridique applicable à une activité de logistique e-commerce et de livraison de marchandises par véhicules utilitaires légers (PTAC ≤ 12 tonnes)

À Monsieur le Directeur Général des Transports Terrestres (DGTT)
Ministère du Transport — Tunis

Monsieur le Directeur Général,

Dans le cadre de la constitution de notre société de droit tunisien [Nom de la Société en cours de création - SARL], spécialisée dans les services logistiques dédiés au commerce électronique et le développement d'une plateforme numérique de suivi des commandes, nous avons l'honneur de solliciter votre confirmation quant au cadre réglementaire applicable à notre activité opérationnelle.

Notre société assurera, pour le compte de commerçants et d'entreprises dûment patentés, la collecte, le tri et la livraison à domicile de marchandises commerciales vendues à distance (accompagnées de leurs factures ou bons de livraison réglementaires), exclusivement au moyen d'une flotte de véhicules utilitaires légers immatriculés en Tunisie dont le Poids Total Autorisé en Charge (PTAC) est inférieur à 3,5 tonnes (et en tout état de cause inférieur ou égal au seuil de 12 tonnes).

Au vu des dispositions de la loi n° 2004-33 du 19 avril 2004 relative à l'organisation des transports terrestres et de l'arrêté du Ministre du Transport du 10 décembre 2008 (tel que modifié par les arrêtés du 16 mai 2022 et du 30 septembre 2025), qui soumettent au cahier des charges et à la déclaration préalable l'exploitation de véhicules dont le PTAC dépasse douze (12) tonnes, nous vous saurions gré de bien vouloir nous confirmer :

1. Que l'exploitation par notre société de véhicules utilitaires légers (PTAC ≤ 12 tonnes) pour la livraison de marchandises commerciales pour le compte de commerçants tiers ne relève pas du cahier des charges relatif aux véhicules dépassant 12 tonnes ;
2. Les éventuelles prescriptions techniques ou de marquage distinctif à observer sur nos véhicules utilitaires légers lors de leur mise en circulation.

Dans l'attente de votre éclairage, nous vous prions d'agréer, Monsieur le Directeur Général, l'expression de notre haute considération.`,Qg=()=>{const[r,o]=k.useState("ALL"),m=r==="ALL"?Ao:Ao.filter(u=>u.decreeYear===r),d=u=>{switch(u){case"critique":return"bg-[#FF7A00] text-white";case"majeur":return"bg-[#3B2A73] text-white";default:return"bg-slate-700 text-white"}};return a.jsxs("section",{id:"decryptage-jort",className:"bg-[#160E28] border border-[#322456] rounded-xl shadow-sm overflow-hidden",children:[a.jsxs("div",{className:"bg-[#241942] px-6 py-5 border-b border-[#322456]",children:[a.jsxs("div",{className:"flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4",children:[a.jsxs("div",{className:"flex items-start gap-3.5",children:[a.jsx("div",{className:"p-2.5 rounded-lg bg-[#FF7A00] text-white shrink-0 mt-0.5",children:a.jsx(Oo,{size:22})}),a.jsxs("div",{children:[a.jsxs("div",{className:"flex flex-wrap items-center gap-2",children:[a.jsx("span",{className:"text-xs font-mono-code uppercase tracking-wider font-bold text-[#FF7A00]",children:"Analyse Juridique des Documents JORT Fournis"}),a.jsx("span",{className:"text-xs font-mono-code px-2 py-0.5 rounded bg-[#160E28] border border-[#322456] text-[#F2EDFF]",children:"Consolidation 2008 → 2017 → 2022 → 30 Sept. 2025"})]}),a.jsx("h2",{className:"text-2xl font-editorial text-[#F2EDFF] mt-1",children:"Décryptage Article par Article du Cahier des Charges (Ministère du Transport)"})]})]}),a.jsx("div",{className:"flex flex-wrap gap-1.5 no-print",children:[{id:"ALL",label:"Tous les Textes (5)"},{id:"2008",label:"Texte de Base (2008)"},{id:"2017",label:"Arrêté Fév. 2017"},{id:"2022",label:"Réforme Mai 2022"},{id:"2025",label:"Arrêté 30 Sept. 2025"}].map(u=>a.jsx("button",{type:"button",onClick:()=>o(u.id),className:`px-3 py-1.5 rounded-lg text-xs font-mono-code font-medium transition-all cursor-pointer ${r===u.id?"bg-[#1B1030] text-white shadow-xs":"bg-[#160E28] text-[#A99BC7] border border-[#322456] hover ournée.",probability:4,impact:4,mitigation:"Refuser tout colis sans matricule fiscal expéditeur ; bordereau avec MF + n° de BL/facture collé sur chaque colis ; manifeste de tournée imprimé et signé ; marquage de la raison sociale sur les portières ; carte grise utilitaire au nom de la société ou du sous-traitant patenté.",owner:"Directeur des opérations"},{id:"R04",category:"Financier",title:"Détournement d’espèces par un livreur",description:"Un livreur indépendant peut détenir 2 000 à 5 000 DT d’espèces en fin de journée. C’est le premier sinistre financier des sociétés de livraison tunisiennes.",probability:4,impact:3,mitigation:"Caution de 500 à 1 500 DT à l’entrée ; plafond d’encaissement journalier ; versement obligatoire au hub chaque soir ou dépôt bancaire ; clôture de caisse dans l’application ; contrat prévoyant la compensation ; assurance « détournement de fonds » si disponible.",owner:"Chef d’agence"},{id:"R05",category:"Opérationnel",title:"Taux de retour supérieur à 25 %",description:"Clients injoignables, refus à la porte, adresses imprécises (absence d’adressage normalisé hors Grand Tunis). Chaque tentative ratée coûte carburant + temps sans recette.",probability:4,impact:4,mitigation:"SMS/WhatsApp de pré-confirmation la veille ; appel obligatoire avant départ ; frais de retour facturés au commerçant ; géolocalisation de l’adresse à la première livraison ; scoring des commerçants à fort taux de retour.",owner:"Responsable qualité"},{id:"R06",category:"RH",title:"Requalification des livreurs indépendants en salariés",description:"Des livreurs « indépendants » travaillant en exclusivité, à horaires imposés, avec le matériel de l’entreprise peuvent être requalifiés en salariés par l’Inspection du Travail ou la CNSS (rappel de cotisations 16,57 % + pénalités).",probability:3,impact:4,mitigation:"Exiger patente ou statut d’auto-entrepreneur ; rémunération à la course et non à l’heure ; liberté d’accepter ou refuser les tournées ; véhicule appartenant au livreur ; absence d’exclusivité ; salarier le noyau dur des chauffeurs de collecte.",owner:"DRH / Avocat"},{id:"R07",category:"Technologique",title:"Fuite ou exploitation illicite des données clients",description:"Fichiers de milliers de destinataires (nom, téléphone, adresse) revendus ou exploités par un employé ; non-déclaration à l’INPDP (loi organique n° 2004-63).",probability:2,impact:4,mitigation:"Déclaration INPDP ; masquage du numéro client dans l’app livreur ; journalisation des exports ; clauses de confidentialité ; purge automatique des données après 12 mois.",owner:"CTO"},{id:"R08",category:"Financier",title:"Tension de trésorerie liée au délai de reversement",description:"Reverser aux commerçants à J+2 alors que les livreurs versent à J+1 et que les retours ne sont facturés qu’en fin de mois crée un besoin en fonds de roulement sous-estimé.",probability:3,impact:3,mitigation:"Reversement hebdomadaire au démarrage (puis J+3) ; facturation des frais de livraison par compensation sur le reversement ; réserve de trésorerie de 2 mois de charges fixes.",owner:"DAF"},{id:"R09",category:"Juridique",title:"Passage ultérieur à des camions > 12 tonnes sans anticipation",description:"En ouvrant des liaisons inter-hubs avec des porteurs > 12 t, la société bascule dans le cahier des charges DGTT (6 véhicules < 5 ans, compétence professionnelle du gérant, cartes d’exploitation ATTT).",probability:2,impact:3,mitigation:"Rester en fourgons ≤ 12 t pour les navettes (ou sous-traiter les liaisons lourdes à un transporteur déjà déclaré) ; prévoir la compétence professionnelle (art. 6) dès le recrutement du directeur des opérations.",owner:"Direction"},{id:"R10",category:"Opérationnel",title:"Dépendance à quelques gros commerçants",description:"Trois clients représentant 60 % du volume : la perte d’un seul met le hub en sous-capacité.",probability:3,impact:3,mitigation:"Objectif : aucun client > 20 % du volume après 12 mois ; offre PME/micro-vendeurs Instagram avec paiement p e technique ATTT périodique.",action:"Calendrier de flotte dans le back-office."},{item:"Documents de transport",rule:"Toute marchandise en circulation doit être accompagnée d’une facture ou d’un bon de livraison (DGELF 28/10/2019).",action:"Bordereau avec MF expéditeur généré automatiquement."}],Rf=[{id:"C01",contract:"Contrat commerçant",title:"Mandat d’encaissement pour le compte du commerçant",text:"Article X — Mandat d'encaissement. Le Commerçant donne mandat exprès au Prestataire d'encaisser, en son nom et pour son compte, auprès des destinataires, le prix des marchandises livrées contre remboursement (« COD »). Les sommes ainsi encaissées demeurent la propriété du Commerçant, sont enregistrées par le Prestataire dans un compte de tiers distinct de ses propres recettes et lui sont reversées selon la périodicité prévue à l'article Y, déduction faite des frais de prestation facturés. Le Prestataire remet à chaque reversement un relevé détaillé par colis (numéro de suivi, date de livraison, montant encaissé).",why:"Fonde juridiquement la séparation entre fonds de tiers et chiffre d’affaires ; protège contre la requalification fiscale."},{id:"C02",contract:"Contrat commerçant",title:"Conformité fiscale des envois",text:"Article X — Documents accompagnant la marchandise. Le Commerçant garantit que chaque colis remis au Prestataire correspond à une vente régulière et est accompagné d'une facture ou d'un bon de livraison conforme à la législation fiscale tunisienne, mentionnant son matricule fiscal. Le Prestataire se réserve le droit de refuser tout colis dépourvu de ces documents ou dont le contenu déclaré est inexact. Le Commerçant garantit le Prestataire contre toute conséquence (saisie, amende, immobilisation) résultant d'un manquement à cette obligation.",why:"Transfère au commerçant la responsabilité de la régularité fiscale ; applique la doctrine DGELF 2019."},{id:"C03",contract:"Contrat commerçant",title:"Responsabilité, perte et avarie — plafond d’indemnisation",text:"Article X — Responsabilité. En cas de perte ou d'avarie imputable au Prestataire, l'indemnisation est limitée à la valeur déclarée du colis dans la plateforme, dans la limite d'un plafond de [300] DT par colis, sauf souscription d'une assurance ad valorem. Sont exclus les objets de valeur, espèces, bijoux, documents officiels et marchandises interdites. Toute réclamation doit être formulée dans les [72] heures suivant la livraison ou la date prévue de livraison.",why:"Borne le risque financier ; conforme à la pratique des contrats-types de transport."},{id:"C04",contract:"Contrat commerçant",title:"Retours et tentatives infructueuses",text:"Article X — Retours. Après [deux] tentatives de livraison infructueuses documentées (appel, SMS, horodatage), le colis est retourné au Commerçant dans un délai de [5] jours ouvrables moyennant des frais de retour de [X] DT. Le refus du destinataire à la porte est assimilé à une tentative infructueuse. Les frais de retour sont compensés sur le prochain reversement.",why:"Fait porter au commerçant une part du coût de l’échec de livraison ; incite à la qualité des adresses."},{id:"C05",contract:"Contrat livreur indépendant",title:"Indépendance et absence de subordination",text:"Article X — Statut. Le Livreur exerce son activité en qualité de prestataire indépendant, titulaire de [patente n° … / statut d'auto-entrepreneur n° …], avec son propre véhicule. Il demeure libre d'accepter ou de refuser les tournées proposées via la plateforme et d'exercer pour d'autres donneurs d'ordre. Il est rémunéré à la prestation effectivement réalisée (colis livré ou retour documenté) sur présentation de facture. Le présent contrat ne crée aucun lien de subordination.",why:"Réduit le risque de requalification en contrat de travail (CNSS, Inspection du Travail)."},{id:"C06",contract:"Contrat livreur indépendant",title:"Garde des fonds et caution",text:"Article X — Fonds encaissés. Les sommes encaissées auprès des destinataires sont détenues par le Livreur en qualité de dépositaire pour le compte du Prestataire et doivent être versées intégralement au hub le jour même, au plus tard à [19h00], contre reçu généré par l'application. Un dépôt de garantie de [1 000] DT est constitué à la signature et restitué à la fin du contrat sous réserve de l'apurement des comptes. Tout écart de caisse non justifié est compensé sur les prestations dues puis sur le dépôt de garantie.",why:"Sécurise le risque n° 1 du métier : l’espèce détenue par le livreur."},{id:"C07",contract:"CGV destinataire",title:"Preuve de livraison et droit de rétractation",text:"Article X — Preuve de livraison. La remise du colis est attestée par la saisie du code de confirmation reçu par SMS, la signature électronique ou la photographie horodatée, qui font foi entre les parties (article 453 bis du Code des obligations et des contrats). Le destinataire dispose du droit de retourner le produit non conforme dans les conditions de l'article 31 de la loi n° 2000-83, exercé auprès du Commerçant vendeur ; le Prestataire n'est pas partie au contrat de vente.",why:"Sécurise la preuve électronique et rappelle que la responsabilité de la vente incombe au commerçant."}],Of=[{q:"Faut-il obligatoirement 6 camions pour commencer ?",a:"Non. L’obligation de 6 véhicules (art. 8 nouveau, arrêté du 16 mai 2022) ne concerne que les véhicules dont le PTAC dépasse 12 tonnes (art. 2 du cahier des charges). Des fourgonnettes de 1,5 à 3,5 t n’y sont pas soumises. Il reste prudent de faire confirmer ce point par écrit à la DGTT.",refs:"Arrêté du 10/12/2008, art. 2 et 8 · Arrêté du 16/05/2022"},{q:"L’arrêté du 30 septembre 2025 change-t-il quelque chose pour nous ?",a:"Il abroge l’article 13, qui dispensait du quota de flotte certains transports spécialisés par véhicules > 12 t (déménagement, dépannage, transport de fonds, déchets, animaux). Il ne touche ni au seuil de 12 tonnes ni au transport léger.",refs:"Arrêté du 30/09/2025, art. 1 à 3"},{q:"Avons-nous besoin d’une autorisation de la Poste Tunisienne ?",a:"Pour des marchandises commerciales facturées livrées contre paiement, l’activité relève du transport et de la logistique, pas de la correspondance. La zone grise concerne les très petits envois (< 1 kg) et les envois « express » visés par le Code de la Poste. D’où la recommandation d’une consultation écrite de la tutelle postale et d’un vocabulaire contractuel strictement logistique.",refs:"Loi n° 98-38 · Étude CNUCED/GIZ"},{q:"Les frais de livraison sont-ils soumis à la TVA ?",a:"Oui. Le taux (19 % services ou 7 % transport de marchandises) dépend de la qualification de la prestation facturée ; faites valider la ventilation par votre expert-comptable. Le montant du produit encaissé pour le commerçant n’est pas soumis à votre TVA : c’est un flux de tiers.",refs:"Code de la TVA · Doctrine DGELF"},{q:"Un livreur indépendant doit-il avoir une patente ?",a:"Oui : patente personne physique ou statut d’auto-entrepreneur, et un véhicule à son nom. Sans cela, il sera considéré comme votre salarié déguisé et la société supportera les cotisations CNSS rétroactives.",refs:"Code du travail · Décret-loi n° 2020-33"},{q:"Que se passe-t-il lors d’un contrôle routier ?",a:"Les agents vérifient la carte grise (usage utilitaire), l’assurance, la visite technique et surtout les documents accompagnant la marchandise. Chaque colis doit porter un bordereau avec le matricule fiscal de l’expéditeur et le numéro de facture/BL ; le livreur doit présenter le manifeste de tournée.",refs:"Prise de position DGELF du 28/10/2019"},{q:"Peut-on démarrer en SUARL avec un seul associé ?",a:"Oui. La SUARL offre la responsabilité limitée à un associé unique. La SARL (2 associés et plus) facilite l’entrée ultérieure d’investisseurs. La condition de nationalité tunisienne (décret-loi 61-14) s’applique si des associés étrangers détiennent la majorité du capital.",refs:"Code des sociétés commerciales · Décret-loi n° 61-14"},{q:"Quel délai réaliste avant le premier colis livré ?",a:"Entre 60 et 90 jours si les démarches sont menées en parallèle : constitution (3–5 semaines), hub et véhicules (4–6 semaines), MVP plateforme (8–10 semaines). Le plan 90 jours de ce dossier détaille le chemin critique.",refs:"Planning § Plan 90 jours"}],_f=[{ar:"كراس الشروط",fr:"Cahier des charges",def:"Document réglementaire fixant les conditions d’exercice d’une activité ; l’opérateur s’y engage par déclaration, sans autorisation préalable."},{ar:"تصريح مسبق",fr:"Déclaration préalable",def:"Déclaration annexée au cahier des charges, déposée en deux exemplaires légalisés auprès de la DGTT."},{ar:"الوزن الجملي المرخص فيه",fr:"Poids total autorisé en charge (PTAC)",def:"Poids maximal du véhicule chargé inscrit sur la carte grise. Seuil déterminant : 12 tonnes."},{ar:"نقل البضائع لحساب الغير",fr:"Transport de marchandises pour le compte d’autrui",def:"Tout transport effectué à titre onéreux ou offert au public (art. 1 du cahier des charges)."},{ar:"بطاقة الاستغلال",fr:"Carte d’exploitation",def:"Titre délivré par l’ATTT pour chaque véhicule soumis au cahier des charges (> 12 t)."},{ar:"الإدارة العامة للنقل البري",fr:"DGTT — Direction Générale des Transports Terrestres",def:"Service du Ministère du Transport compétent pour les cahiers des charges du transport routier."},{ar:"الوكالة الفنية للنقل البري",fr:"ATTT — Agence Technique des Transports Terrestres",def:"Immatriculation, visites techniques, cartes d’exploitation."},{ar:"السجل الوطني للمؤسسات",fr:"RNE — Registre National des Entreprises",def:"Registre d’immatriculation des sociétés ; délivre l’extrait RNE."},{ar:"المعرف الجبائي",fr:"Matricule fiscal (MF)",def:"Identifiant fiscal unique ; doit figurer sur chaque bordereau d’expédition."},{ar:"الرائد الرسمي",fr:"JORT — Journal Officiel de la République Tunisienne",def:"Publication officielle des lois, décrets et arrêtés."},{ar:"الدفع عند التسليم",fr:"Paiement à la livraison (COD)",def:"Encaissement du prix par le livreur à la remise du colis, pour le 2. MODÈLE JURIDIQUE & OPÉRATIONNEL RECOMMANDÉ :
- Forme juridique : SARL (ou SUARL) déclarée en ligne auprès de l'APII (Services logistiques + Plateforme informatique).
- Positionnement : Transport routier léger de marchandises commerciales facturées (≤ 12t) + Services logistiques e-commerce (Fulfillment) + Plateforme numérique.
- Flotte recommandée : Modèle hybride (quelques fourgonnettes propres en leasing pour le ramassage + réseau de livreurs indépendants patentés payés à la course livrée).

3. LES 3 OBLIGATIONS CRITIQUES DE CONFORMITÉ EN TUNISIE :
- Paiement à la livraison (COD) : Ouvrir 2 comptes bancaires séparés (Compte d'exploitation propre vs Compte de cantonnement Classe 4 pour les fonds encaissés pour compte des marchands) + Mandat d'encaissement dans les CGV.
- Contrôle routier & Fisc (Note DGELF du 28/10/2019) : Chaque colis e-commerce transporté doit obligatoirement afficher un Bordereau / Bon de livraison mentionnant le Matricule Fiscal du commerçant expéditeur et le contenu déclaré.
- Protection des données : Déclaration auprès de l'INPDP.

4. BUDGET & RENTABILITÉ (SCÉNARIO STRUCTURÉ 100–350 k DT) :
- CAPEX ≈ 162 k DT (6 utilitaires en leasing, hub + 2 agences, plateforme IT) + BFR ≈ 95 k DT.
- Charges fixes ≈ 35 k DT/mois ; seuil de rentabilité ≈ 300–350 colis/jour à 8 DT avec 82 % de taux de succès.
- Livreurs : mix 3–4 chauffeurs salariés (CNSS 16,57 % patronal) + 10–20 indépendants patentés / auto-entrepreneurs payés 3,5–4,5 DT par colis livré.

5. TOP 3 DES RISQUES À TRAITER AVANT LE LANCEMENT :
- Requalification fiscale des encaissements COD (mandat d'encaissement + compte de passage).
- Immobilisation d'un véhicule en contrôle routier (bordereau avec MF expéditeur sur chaque colis).
- Taux de retour > 25 % (pré-confirmation SMS, frais de retour facturés).

6. PLAN 90 JOURS : Cadrage (J1–J30) → Constitution (J8–J38) → Conformité hub/flotte/contrats/MVP (J15–J70) → Pilote Grand Tunis 100 → 300 colis/jour (J70–J90) → Comité de décision extension Sahel/Sfax.

    <style>
      /* Règles CSS ajoutées pour forcer l'adaptabilité mobile */
      @media (max-width: 768px) {
        /* Empêcher le débordement horizontal du corps de la page */
        body {
          overflow-x: hidden;
          width: 100%;
        }
        
        /* Rendre tous les tableaux défilables horizontalement */
        table {
          display: block;
          width: 100%;
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
          white-space: nowrap;
        }
        
        /* Ajuster les espacements globaux pour les petits écrans */
        .p-6, .p-8, .px-8, .py-10, .lg\:px-14, .lg\:py-12 {
          padding: 1rem !important;
        }
        
        /* Réduire la taille des grands titres */
        h1, .text-3xl, .text-4xl, .text-2xl {
          font-size: 1.5rem !important;
          line-height: 1.2 !important;
        }
        
        /* Rendre les grilles fluides en forçant 1 colonne s'il y a des débordements */
        .grid {
          grid-template-columns: 1fr !important;
        }
        
        /* Exceptions pour certaines petites grilles (ex: statistiques) */
        .grid.grid-cols-2 {
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        }
        
        /* Ajuster la hauteur de la barre latérale pour qu'elle ne soit pas collante sur mobile */
        aside {
          position: relative !important;
          top: 0 !important;
        }
        
        /* Redimensionner les modales pour qu'elles s'affichent correctement */
        .max-w-4xl {
          max-width: 100% !important;
          margin: 0.5rem !important;
        }
        
        /* Ajustement de l'écran du livreur (caisse/scanner) */
        .h-\[calc\(100dvh-11rem\)\] {
          height: auto !important;
          min-height: 70vh !important;
        }
      }
    </style>
    

<style>
  /* Forcer la couleur du texte dans les champs de saisie à être blanche et bien visible */
  input, textarea, select {
      color: #FFFFFF !important;
  }
  
  /* Rendre les placeholders (textes d'indication) plus clairs */
  input::placeholder, textarea::placeholder {
      color: #C4B5FD !important; /* Violet très clair */
      opacity: 0.9 !important;
  }
  
  /* Corriger le problème des couleurs de remplissage automatique (autofill) sur les navigateurs basés sur WebKit (Chrome, Safari) */
  input:-webkit-autofill,
  input:-webkit-autofill:hover, 
  input:-webkit-autofill:focus, 
  input:-webkit-autofill:active {
      -webkit-text-fill-color: #FFFFFF !important;
      transition: background-color 5000s ease-in-out 0s;
  }
</style>
